name: unity-build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (Win64, WebGL, Android, StandaloneLinux64, OSXUniversal)'
        required: true
        default: 'WebGL'
        type: choice
        options:
          - Win64
          - WebGL
          - Android
          - StandaloneLinux64
          - OSXUniversal
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

jobs:
  build:
    name: Unity Build (${{ github.event.inputs.target || 'WebGL' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Unity Build Action
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: '6000.3.10f1'
          targetPlatform: ${{ github.event.inputs.target || 'WebGL' }}
          buildMethod: Paintball.Editor.BuildScript.PerformBuild

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.target || 'WebGL' }}
          path: build/