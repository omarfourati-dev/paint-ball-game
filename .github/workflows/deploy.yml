name: CI & Deploy – paint-ball-game.omarfourati.de

# Kein pull_request-Trigger: Code aus Forks darf nie auf dem Self-hosted-Runner laufen (öffentliches Repo).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur Lesezugriff für GITHUB_TOKEN: kein Job schreibt nach GitHub (Checkout liest; Artefakt-Upload/-Download und der
# npm-Cache von setup-node laufen über das eigene Runtime-Token der Actions, nicht über GITHUB_TOKEN).
permissions:
  contents: read

env:
  DEPLOY_DIR: /home/paintball

jobs:
  # ─── Tests (Core, Server, Client) ────────────────────
  test:
    name: Tests
    uses: ./.github/workflows/web-mvp.yml

  # ─── Änderungen erkennen (Desktop nur bei desktop/**) ─
  changes:
    name: Änderungen erkennen
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # workflow_dispatch, erster Push oder unbekanntes before (Force-Push): immer bauen
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -q '^desktop/'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Desktop-App (.exe, ohne Code-Signing) ────────────
  # Nur bei Änderungen unter desktop/ (oder workflow_dispatch). Achtung: Scheitert dieser Build und berührt der nächste
  # Push desktop/ nicht, wird er NICHT wiederholt – die Downloads bleiben auf dem alten Stand. Abhilfe: den Workflow
  # von Hand starten (Actions → „CI & Deploy“ → Run workflow, workflow_dispatch baut immer). Das Artefakt desktop-exe
  # wird nur 7 Tage aufbewahrt; es wird ohnehin im selben Lauf vom Deploy abgeholt.
  desktop:
    name: Desktop-App (.exe)
    runs-on: windows-latest
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      # Kein Zertifikat: electron-builder soll weder im Zertifikatsspeicher suchen noch signieren
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Version setzen (major.minor aus package.json, Patch = Laufnummer)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "PB_VERSION=$base.$RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Bauen (NSIS pro Benutzer + portable)
        run: npm run dist -- -c.extraMetadata.version="$PB_VERSION"
      - name: Prüfsummen und latest.json
        run: node scripts/manifest.js dist "$PB_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-exe
          path: |
            desktop/dist/PaintBall-Setup-*.exe
            desktop/dist/PaintBall-*-portable.exe
            desktop/dist/SHA256SUMS.txt
            desktop/dist/latest.json
          if-no-files-found: error
          retention-days: 7

  # ─── Deploy (nur main, nur wenn Tests grün) ──────────
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    environment: production
    needs: [test, changes, desktop]
    # !cancelled() statt des impliziten success(): auch laufen, wenn der Desktop-Job übersprungen wurde (keine Änderung
    # unter desktop/) – dann bleiben die vorhandenen Downloads liegen. Anders als always() bricht ein Abbruch des Laufs
    # den Deploy ab. Rote Tests oder ein kaputter Desktop-Build stoppen den Deploy.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' && needs.changes.result == 'success' &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tip of main
        # Schutz vor dem Deploy-Race: Braucht der Windows-Build lange, kann ein neuerer Push schon deployt sein. Dann darf
        # dieser ältere Lauf den Code nicht zurückdrehen – rsync, Compose und Caddy werden übersprungen. Das Checkout behält
        # sein Token (persist-credentials), contents: read reicht für den Fetch. Scheitert der Fetch, scheitert der Schritt.
        id: tip
        run: |
          git fetch --no-tags --depth=1 origin main
          tip=$(git rev-parse FETCH_HEAD)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Überspringe Code-Deploy: $GITHUB_SHA ist nicht mehr der Stand von origin/main ($tip). Ein neuerer Lauf deployt."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync code to deploy directory
        if: steps.tip.outputs.current == 'true'
        run: |
          mkdir -p $DEPLOY_DIR
          rsync -rlD --no-owner --no-group --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='bin' \
            --exclude='obj' \
            --exclude='server-data' \
            --exclude='/downloads' \
            --exclude='.env' \
            $GITHUB_WORKSPACE/ $DEPLOY_DIR/

      - name: Ensure downloads directory
        # Außerhalb des rsync-Abgleichs (--exclude='/downloads'), bleibt über Deploys erhalten; vor docker compose up anlegen,
        # sonst legt Docker das Mount-Verzeichnis als root an. 755 auch bei übersprungenem Desktop-Job: Der Container-Nutzer
        # (APP_UID) zählt als „andere“ und braucht r-x, egal welche umask der Runner hat.
        run: mkdir -p $DEPLOY_DIR/downloads && chmod 755 $DEPLOY_DIR/downloads

      - name: Download desktop build
        if: needs.desktop.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: desktop-exe
          path: ${{ runner.temp }}/desktop-exe

      - name: Publish desktop downloads
        if: needs.desktop.result == 'success'
        run: bash desktop/scripts/publish-downloads.sh "$RUNNER_TEMP/desktop-exe" "$DEPLOY_DIR/downloads"

      - name: Ensure Docker network 'web' exists
        if: steps.tip.outputs.current == 'true'
        run: docker network create web 2>/dev/null || echo "Network 'web' already exists."

      - name: Create database if not exists
        if: steps.tip.outputs.current == 'true'
        run: |
          # Nur „already exists“ ist harmlos; jeder andere Fehler (Rolle fehlt, Container weg …) lässt den Schritt scheitern.
          if out=$(docker exec zentrades-postgres psql -U zentrades -c "CREATE DATABASE paintball OWNER paintball;" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "already exists"; then
            echo "Database 'paintball' already exists – skipping."
          else
            echo "$out"
            exit 1
          fi

      - name: Write .env
        if: steps.tip.outputs.current == 'true'
        run: |
          # AdSense (öffentliche Werte, daher GitHub-Variables): nur gültige Werte schreiben – gleiche Regeln wie der Server
          # (AdsConfig.cs). Ungültiges oder Fehlendes fällt weg, dann bleibt die Werbung bzw. der Slot aus. printf '%s\n'
          # schreibt genau eine Zeile; da die Muster nur Ziffern/ca-pub- erlauben, kann kein Zeilenumbruch eine zweite Variable einschleusen.
          adsense_line() { # Name, Wert, Muster
            if [[ -n "$2" && "$2" =~ $3 ]]; then printf '%s\n' "$1=$2"
            elif [[ -n "$2" ]]; then echo "::warning::$1 hat ein ungültiges Format und wird nicht gesetzt" >&2; fi
          }
          {
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            adsense_line ADSENSE_CLIENT "$ADSENSE_CLIENT" '^ca-pub-[0-9]{16}$'
            adsense_line ADSENSE_SLOT_LANDING "$ADSENSE_SLOT_LANDING" '^[0-9]+$'
            adsense_line ADSENSE_SLOT_LOBBY "$ADSENSE_SLOT_LOBBY" '^[0-9]+$'
            adsense_line ADSENSE_SLOT_RESULTS "$ADSENSE_SLOT_RESULTS" '^[0-9]+$'
            adsense_line ADSENSE_INTERSTITIAL_EVERY "$ADSENSE_INTERSTITIAL_EVERY" '^[0-9]{1,3}$'
          } > $DEPLOY_DIR/.env
          chmod 600 $DEPLOY_DIR/.env
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT_LANDING: ${{ vars.ADSENSE_SLOT_LANDING }}
          ADSENSE_SLOT_LOBBY: ${{ vars.ADSENSE_SLOT_LOBBY }}
          ADSENSE_SLOT_RESULTS: ${{ vars.ADSENSE_SLOT_RESULTS }}
          ADSENSE_INTERSTITIAL_EVERY: ${{ vars.ADSENSE_INTERSTITIAL_EVERY }}

      - name: Build image
        if: steps.tip.outputs.current == 'true'
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose build --no-cache

      - name: Stop old container
        if: steps.tip.outputs.current == 'true'
        # Erst SIGTERM mit 45 s Frist: der Server schließt die WebSockets (1001 server_restart), stoppt den Spieltakt
        # und schreibt die Warteschlange weg. "docker rm -f" allein wäre ein SIGKILL und verlöre offene Spielstände.
        run: |
          docker stop -t 45 paintball 2>/dev/null || true
          docker rm -f paintball 2>/dev/null || true

      - name: Start service
        if: steps.tip.outputs.current == 'true'
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose up -d --remove-orphans

      - name: Wait for health
        if: steps.tip.outputs.current == 'true'
        run: |
          echo "Waiting for paintball to become healthy..."
          for i in $(seq 1 12); do
            # Exakter Vergleich: grep -q "healthy" träfe auch „unhealthy“.
            if [ "$(docker inspect --format='{{.State.Health.Status}}' paintball 2>/dev/null)" = "healthy" ]; then
              echo "Paintball is healthy."
              exit 0
            fi
            echo "  Attempt $i/12 – waiting 10s..."
            sleep 10
          done
          echo "Paintball did not become healthy in time."
          docker logs paintball --tail=50
          exit 1

      - name: Show status
        if: steps.tip.outputs.current == 'true'
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose ps

      - name: Reload Caddy
        if: steps.tip.outputs.current == 'true'
        run: docker compose -f /opt/caddy/docker-compose.yml exec caddy caddy reload --config /etc/caddy/Caddyfile

      - name: Clean up dangling images
        if: steps.tip.outputs.current == 'true'
        run: docker image prune -f
