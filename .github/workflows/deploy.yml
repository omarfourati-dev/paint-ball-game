name: CI & Deploy – paint-ball-game.omarfourati.de

# Kein pull_request-Trigger: Code aus Forks darf nie auf dem Self-hosted-Runner laufen (öffentliches Repo).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_DIR: /home/paintball

jobs:
  # ─── Tests (Core, Server, Client) ────────────────────
  test:
    name: Tests
    uses: ./.github/workflows/web-mvp.yml

  # ─── Deploy (nur main, nur wenn Tests grün) ──────────
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    environment: production
    needs: [test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to deploy directory
        run: |
          mkdir -p $DEPLOY_DIR
          rsync -rlD --no-owner --no-group --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='bin' \
            --exclude='obj' \
            --exclude='server-data' \
            --exclude='.env' \
            $GITHUB_WORKSPACE/ $DEPLOY_DIR/

      - name: Ensure Docker network 'web' exists
        run: docker network create web 2>/dev/null || echo "Network 'web' already exists."

      - name: Create database if not exists
        run: |
          # Nur „already exists“ ist harmlos; jeder andere Fehler (Rolle fehlt, Container weg …) lässt den Schritt scheitern.
          if out=$(docker exec zentrades-postgres psql -U zentrades -c "CREATE DATABASE paintball OWNER paintball;" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "already exists"; then
            echo "Database 'paintball' already exists – skipping."
          else
            echo "$out"
            exit 1
          fi

      - name: Write .env
        run: |
          {
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
          } > $DEPLOY_DIR/.env
          chmod 600 $DEPLOY_DIR/.env
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Build image
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose build --no-cache

      - name: Stop old container
        # Erst SIGTERM mit 45 s Frist: der Server schließt die WebSockets (1001 server_restart), stoppt den Spieltakt
        # und schreibt die Warteschlange weg. "docker rm -f" allein wäre ein SIGKILL und verlöre offene Spielstände.
        run: |
          docker stop -t 45 paintball 2>/dev/null || true
          docker rm -f paintball 2>/dev/null || true

      - name: Start service
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose up -d --remove-orphans

      - name: Wait for health
        run: |
          echo "Waiting for paintball to become healthy..."
          for i in $(seq 1 12); do
            # Exakter Vergleich: grep -q "healthy" träfe auch „unhealthy“.
            if [ "$(docker inspect --format='{{.State.Health.Status}}' paintball 2>/dev/null)" = "healthy" ]; then
              echo "Paintball is healthy."
              exit 0
            fi
            echo "  Attempt $i/12 – waiting 10s..."
            sleep 10
          done
          echo "Paintball did not become healthy in time."
          docker logs paintball --tail=50
          exit 1

      - name: Show status
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose ps

      - name: Reload Caddy
        run: docker compose -f /opt/caddy/docker-compose.yml exec caddy caddy reload --config /etc/caddy/Caddyfile

      - name: Clean up dangling images
        run: docker image prune -f
