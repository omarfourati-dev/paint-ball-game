services:
  paintball:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paintball
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # lokal ohne .env startbar; der Deploy schreibt sie aus den GitHub-Secrets
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Europe/Berlin
      DATABASE_URL: postgresql://paintball:${DB_PASSWORD}@host.docker.internal:5433/paintball
      PUBLIC_URL: https://paint-ball-game.omarfourati.de
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - paintball-data:/data   # altes Volume der Datei-Konten, nach Umstieg löschen
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - web

volumes:
  # altes Volume der Datei-Konten, nach Umstieg löschen
  paintball-data:
    name: paintball-data

networks:
  web:
    external: true
