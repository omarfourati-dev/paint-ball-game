services:
  paintball:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paintball
    restart: unless-stopped
    # Zeit für ein geordnetes Herunterfahren (Host-Stopp-Budget 25 s inkl. 10 s Leeren der Schreib-Warteschlange) vor dem SIGKILL
    stop_grace_period: 45s
    env_file:
      - path: .env
        required: false   # lokal ohne .env startbar; der Deploy schreibt sie aus den GitHub-Secrets
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Europe/Berlin
      DATABASE_URL: postgresql://paintball:${DB_PASSWORD}@host.docker.internal:5433/paintball
      PUBLIC_URL: https://paint-ball-game.omarfourati.de
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - web

networks:
  web:
    external: true
