<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Paint-Ball</title>
  <meta name="description" content="Schnelles Online-Paintball im Browser – Team-Deathmatch, Capture the Flag, King of the Hill und mehr.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1b1433">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://analytics.omarfourati.de/s.js"
    integrity="sha384-Q7LWJ0d79x9/eb2UnZhltUIhfCeHTL11GIX5RfQt0vpmPNfpEhfUDURwgKBLYmg7" crossorigin="anonymous"
    data-website-id="433aa418-48dc-4a32-ba2d-f0b6c8a7ed62" data-domains="paint-ball-game.omarfourati.de"
    data-do-not-track="true"></script>
</head>
<body>
  <canvas id="game" aria-label="Spielansicht"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>

  <div id="touch" class="touch hidden" aria-hidden="true">
    <div class="stick"><div class="knob"></div></div>
    <div class="touch-buttons">
      <button data-btn="fire" class="tb tb-fire">🎯</button>
      <button data-btn="fire" class="tb tb-fire2">🎯</button>
      <button data-btn="jump" class="tb tb-jump">⤒</button>
      <button data-btn="crouch" class="tb tb-crouch">⤓</button>
      <button data-btn="reload" class="tb tb-reload">⟳</button>
      <button data-btn="dash" class="tb tb-dash">⇢</button>
      <button data-btn="use" class="tb tb-use">✚</button>
      <button data-btn="chat" class="tb tb-chat">💬</button>
      <button data-btn="pause" class="tb tb-pause">❚❚</button>
    </div>
  </div>

  <main id="screens">
    <section id="screen-loading" class="screen active" aria-live="polite"></section>
    <section id="screen-login" class="screen"></section>
    <section id="screen-name" class="screen"></section>
    <section id="screen-conn" class="screen"></section>
    <section id="screen-menu" class="screen"></section>
    <section id="screen-lobby" class="screen"></section>
    <section id="screen-results" class="screen"></section>
    <section id="screen-customize" class="screen"></section>
    <section id="screen-shop" class="screen"></section>
    <section id="screen-profile" class="screen"></section>
    <section id="screen-leaderboard" class="screen"></section>
    <section id="screen-settings" class="screen"></section>
  </main>

  <div id="click-to-play" class="overlay hidden"><button class="btn big" id="btn-click-play"></button></div>
  <div id="pause" class="overlay hidden" role="dialog" aria-modal="true"></div>
  <div id="wheel" class="overlay hidden" role="dialog"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
